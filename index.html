<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIM Lookup API</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-b from-purple-600 to-indigo-700 min-h-screen text-white">

<div class="max-w-4xl mx-auto py-10">

  <div class="text-center mb-8">
    <div class="bg-green-500 text-black inline-block px-6 py-2 rounded-full font-semibold shadow-lg">
      ✔ SYSTEM OPERATIONAL • API ACTIVE
    </div>
  </div>

  <h1 class="text-4xl font-bold text-center mb-2">📱 SIM Lookup API</h1>
  <p class="text-center text-gray-200 mb-10">Use this API to fetch SIM details</p>

  <div class="space-y-8">

    <div class="bg-white/10 backdrop-blur-lg p-6 rounded-3xl shadow-xl">
      <h2 class="text-2xl font-bold mb-3">GET /api?number=92300XXXXXXX</h2>
      <p class="text-gray-200 mb-3">Query Param Lookup</p>

      <div class="bg-black/40 p-4 rounded-xl text-sm font-mono overflow-x-auto">
        GET https://your-vercel-domain.vercel.app/api?number=923001234567
      </div>
    </div>

    <div class="bg-white/10 backdrop-blur-lg p-6 rounded-3xl shadow-xl">
      <h2 class="text-2xl font-bold mb-3">API Response Example</h2>

      <div class="bg-black/40 p-4 rounded-xl text-sm font-mono overflow-x-auto">
{
  "success": true,
  "number": "923001234567",
  "result": { ... }
}
      </div>
    </div>

  </div>

</div>

</body>
</html>
